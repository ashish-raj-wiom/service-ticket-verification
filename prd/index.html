<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Task Verification PRD</title>
<style>
  :root { --bg:#fbfaf7; --fg:#22211f; --muted:#6b6a65; --line:#e3e1da; --card:#ffffff; --accent:#1f5fa8; --code:#f2f0ea; --on:#1f5fa8; --onfg:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1b19; --fg:#e8e6df; --muted:#a3a19a; --line:#3a3935; --card:#242422; --accent:#7fb2ee; --code:#2c2b28; --on:#7fb2ee; --onfg:#1b1b19; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 16px 80px; }
  nav { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 0; }
  nav .group { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:3px 0; }
  nav .label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; min-width:92px; }
  nav a { font-size:13px; text-decoration:none; color:var(--fg); border:1px solid var(--line); background:var(--card); border-radius:999px; padding:3px 11px; white-space:nowrap; }
  nav a:hover { border-color:var(--accent); }
  nav a[aria-current="page"] { background:var(--on); color:var(--onfg); border-color:var(--on); }
  .src { font-size:13px; color:var(--muted); padding:10px 0 8px; }
  .src a { color:var(--accent); }
  h1 { font-size:28px; line-height:1.25; margin:18px 0 12px; }
  h2 { font-size:21px; margin:40px 0 12px; padding-top:12px; border-top:1px solid var(--line); }
  h3 { font-size:17px; margin:28px 0 8px; }
  a { color:var(--accent); }
  .tw { overflow-x:auto; margin:12px 0; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { text-align:left; vertical-align:top; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { background:var(--code); font-weight:600; }
  tr:last-child td { border-bottom:0; }
  code { background:var(--code); padding:1px 5px; border-radius:4px; font-size:0.9em; }
  pre { background:var(--code); padding:12px; border-radius:8px; overflow-x:auto; }
  pre code { background:none; padding:0; }
  hr { border:0; border-top:1px solid var(--line); margin:28px 0; }
  .mermaid { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; overflow-x:auto; text-align:center; }
  .err { color:#b2291f; }
  .uat { display:inline-block; margin-left:6px; font-size:11px; font-weight:600; line-height:1.5; padding:0 7px; border-radius:999px; white-space:nowrap; vertical-align:1px; cursor:help; }
  .uat.pass { background:#e3f3e6; color:#1d6b2f; }
  .uat.fail { background:#fbe5e2; color:#a12a1d; }
  .uat.todo { background:var(--code); color:var(--muted); }
  @media (prefers-color-scheme: dark) { .uat.pass { background:#1f3a25; color:#8fd6a0; } .uat.fail { background:#4a221d; color:#f2a59b; } }
  .uatsum { font-size:13px; color:var(--muted); padding:0 0 8px; }
  details.buckets { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin:0 0 18px; font-size:14px; }
  details.buckets summary { cursor:pointer; font-weight:600; }
  .bk { padding:10px 0; border-top:1px solid var(--line); }
  .bk:first-of-type { border-top:0; }
  .bk h4 { margin:0 0 2px; font-size:14px; }
  .bk h4 .n { font-weight:400; color:var(--muted); }
  .bk p { margin:2px 0 6px; color:var(--muted); font-size:13px; }
  .bk .ids { display:flex; flex-wrap:wrap; gap:4px; }
  .bk .ids a, .bk .ids span { font-size:12px; padding:0 7px; border-radius:999px; background:var(--code); color:inherit; text-decoration:none; line-height:1.7; }
  .bk .ids a { outline:1px solid var(--line); }
  tr:target { outline:2px solid #e0a100; }
  @media (max-width: 600px) { nav .label { min-width:100%; } }
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <div class="src" id="src"></div>
  <div class="uatsum" id="uatsum"></div>
  <details class="buckets" id="buckets" hidden></details>
  <main id="doc">Loading…</main>
</div>
<script type="module">
import { marked } from "https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js";
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

// Every document on this page. Each is rendered as-is from its markdown file.
const DOCS = [
  { id: "v1.2",  group: "Full PRD",     label: "v1.2 · signed off 15 Oct",   file: "Service_Task_Verification_PRD.md" },
  { id: "short", group: "Full PRD",     label: "Shortened · draft 20 Oct",   file: "Service_Task_Verification_PRD_v1.2-short.md" },
  { id: "p1",    group: "Phase PRDs",   label: "P1 Core loop (incl. chat reopen)", file: "phases/STV_P1_Core_Loop_PRD.md" },
  { id: "p2",    group: "Phase PRDs",   label: "P2 Internet Verdict after the Initial Check", file: "phases/STV_P2_Internet_Verdict_After_Initial_Check_PRD.md" },
  { id: "p3",    group: "Phase PRDs",   label: "P3 Closure signals: Quality OS, M3, IVR PIN",       file: "phases/STV_P3_Quality_OS_Signals_And_M3_PRD.md" },
  { id: "p4",    group: "Phase PRDs",   label: "P4 Records",                 file: "phases/STV_P4_Records_PRD.md" },
  { id: "how",   group: "How it was done", label: "Shortening, phasing and gap finder", file: "Shortening_Phasing_GapFinder.md" },
];
const want = new URLSearchParams(location.search).get("doc");
const cur = DOCS.find(d => d.id === want) || DOCS[0];

const nav = document.getElementById("nav");
for (const g of [...new Set(DOCS.map(d => d.group))]) {
  const row = document.createElement("div"); row.className = "group";
  const l = document.createElement("span"); l.className = "label"; l.textContent = g; row.appendChild(l);
  for (const d of DOCS.filter(x => x.group === g)) {
    const a = document.createElement("a"); a.href = "?doc=" + d.id; a.textContent = d.label;
    if (d === cur) a.setAttribute("aria-current", "page");
    row.appendChild(a);
  }
  nav.appendChild(row);
}
const note = cur.group === "Phase PRDs"
  ? " The phase PRDs are split from the shortened PRD; all four are tested together before release (P1 §2)."
  : cur.id === "short" ? " A shortened draft of v1.2; v1.2 stays the signed-off version." : "";
document.getElementById("src").innerHTML =
  'Rendered live from <a href="' + cur.file + '">' + cur.file.split("/").pop() + "</a>. This page adds nothing to the document except the UAT tags, which come from uat.json." + note;

const doc = document.getElementById("doc");
try {
  const res = await fetch(cur.file, { cache: "no-store" });
  if (!res.ok) throw new Error("Could not load " + cur.file + " (" + res.status + ")");
  const md = await res.text();
  doc.innerHTML = marked.parse(md);

  const h1 = doc.querySelector("h1");
  if (h1) document.title = h1.textContent;

  doc.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div"); w.className = "tw";
    t.replaceWith(w); w.appendChild(t);
  });

  // UAT tags come from uat.json, not from the PRD files.
  try {
    const u = await (await fetch("uat.json", { cache: "no-store" })).json();
    if (u.docs.includes(cur.id)) {
      const label = { pass: "UAT passed", fail: "UAT failed", todo: "Yet to test" };
      const count = { pass: 0, fail: 0, todo: 0 };
      doc.querySelectorAll("tr > td:first-child").forEach(td => {
        const id = td.textContent.trim();
        if (!/^AC-[A-Z0-9]+-\d+[a-z]?$/.test(id)) return;
        const r = u.results[id] || { status: "todo", note: "Not tested yet" };
        count[r.status]++;
        const s = document.createElement("span");
        s.className = "uat " + r.status; s.textContent = label[r.status]; s.title = r.note;
        td.appendChild(s);
        if (!document.getElementById(id)) td.parentElement.id = id;
      });
      if (count.pass + count.fail + count.todo)
        document.getElementById("uatsum").textContent =
          `UAT on ${u.env}, as of ${u.asOf}: ${count.pass} passed · ${count.fail} failed · ${count.todo} yet to test. Hover a tag for the note.`;
    }
    // Pending buckets: every AC not yet passed or failed, grouped by what it is waiting for.
    if (u.buckets) {
      const done = id => ["pass", "fail"].includes((u.results[id] || {}).status);
      const groups = u.buckets.map(b => ({ ...b, left: b.ids.filter(id => !done(id)) })).filter(b => b.left.length);
      const total = groups.reduce((n, b) => n + b.left.length, 0);
      if (total) {
        const el = document.getElementById("buckets");
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        el.innerHTML = `<summary>Pending UAT: ${total} ACs in ${groups.length} buckets (all phases)</summary>` +
          groups.map(b => `<div class="bk"><h4>${esc(b.name)} <span class="n">· ${b.left.length}</span></h4>` +
            `<p><b>Waiting on:</b> ${esc(b.blocker)}. ${esc(b.how)}.</p><div class="ids">` +
            b.left.map(id => document.getElementById(id) ? `<a href="#${id}">${id}</a>` : `<span>${id}</span>`).join("") +
            `</div></div>`).join("");
        el.hidden = false;
      }
    }
  } catch (e) { /* no tags if uat.json is missing */ }

  doc.querySelectorAll("pre > code.language-mermaid").forEach(c => {
    const d = document.createElement("div"); d.className = "mermaid"; d.textContent = c.textContent;
    c.parentElement.replaceWith(d);
  });
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
  await mermaid.run({ querySelector: ".mermaid" });
} catch (e) {
  doc.innerHTML = '<p class="err">' + e.message + "</p>";
}
</script>
</body>
</html>
